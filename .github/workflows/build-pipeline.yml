name: Meshtastic Custom Builds Pipeline

on:
  schedule:
    # Run every 3 hours to track upstream releases
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
    paths:
      - 'build-config.yaml'
      - 'variants/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Specific upstream tag to build (e.g. v2.8.1.8e6a88d)'
        required: false
        type: string
      force_rebuild:
        description: 'Force rebuild even if output directory already exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: meshtastic-build-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    name: Plan Build Matrix
    runs-on: ubuntu-latest
    outputs:
      has_builds: ${{ steps.resolver.outputs.has_builds }}
      matrix: ${{ steps.resolver.outputs.matrix }}
      active_folders: ${{ steps.resolver.outputs.active_folders }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml

      - name: Resolve build matrix & upstream releases
        id: resolver
        env:
          FORCE_TAG: ${{ inputs.force_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/resolve_matrix.py

  compile:
    name: Compile ${{ matrix.variant_name }} (${{ matrix.build_type }} @ ${{ matrix.tag }})
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: [self-hosted, meshtastic-builder]
    env:
      PYTHONPATH: /usr/local/lib/python3.12/dist-packages:/opt/pio-venv/lib/python3.12/site-packages
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: '0'
      PLATFORMIO_SETTING_CHECK_PLATFORMIO_INTERVAL: '3650'
      PLATFORMIO_SETTING_CHECK_PRUNE_SYSTEM_THRESHOLD: '10240'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Clean workspace before build
        run: |
          rm -rf overlay firmware artifact_output

      - name: Checkout custom overlay repository
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout meshtastic/firmware upstream
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: ${{ matrix.tag }}
          submodules: recursive
          path: firmware

      - name: Overlay custom variant
        if: matrix.is_custom_variant
        run: |
          if [ -n "${{ matrix.variant_dir }}" ] && [ -d "overlay/variants/${{ matrix.variant_dir }}" ]; then
            echo "Overlaying custom variant ${{ matrix.variant_dir }} into firmware/variants/${{ matrix.variant_dir }}..."
            mkdir -p "firmware/variants/${{ matrix.variant_dir }}"
            cp -rf "overlay/variants/${{ matrix.variant_dir }}/." "firmware/variants/${{ matrix.variant_dir }}/"
            rm -f "firmware/variants/${{ matrix.variant_dir }}/.gitkeep" || true
          fi

      - name: Apply upstream pull requests
        if: matrix.upstream_prs != ''
        working-directory: firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for pr in ${{ matrix.upstream_prs }}; do
            echo "Fetching and applying upstream PR #${pr}..."
            if [ -f "../overlay/patches/pr-${pr}.patch" ]; then
              echo "Found pre-adapted local patch for PR #${pr}, applying..."
              git apply --ignore-whitespace --whitespace=fix "../overlay/patches/pr-${pr}.patch"
            else
              gh api "repos/meshtastic/firmware/pulls/${pr}" -H "Accept: application/vnd.github.v3.diff" | git apply --ignore-whitespace --whitespace=fix
            fi
          done

      - name: Apply local patches
        if: matrix.local_patches != ''
        working-directory: firmware
        run: |
          for patch in ${{ matrix.local_patches }}; do
            echo "Applying local patch ${patch}..."
            git apply --ignore-whitespace --whitespace=fix "../overlay/patches/${patch}"
          done

      - name: Build firmware target with PlatformIO
        working-directory: firmware
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.build_flags }}
        run: |
          pio run -e ${{ matrix.pio_env }} -t mtjson

      - name: Collect artifacts and generate build manifest
        run: |
          mkdir -p artifact_output

          # Collect firmware binaries, manifests, and filesystem images
          SEARCH_DIRS="firmware/.pio/build/${{ matrix.pio_env }} firmware/release"
          for sdir in $SEARCH_DIRS; do
            if [ -d "$sdir" ]; then
              find "$sdir" -maxdepth 2 -type f \( \
                -name "firmware*.bin" -o \
                -name "firmware*.uf2" -o \
                -name "firmware*.factory.bin" -o \
                -name "firmware*.zip" -o \
                -name "firmware*.hex" -o \
                -name "firmware*.mt.json" -o \
                -name "littlefs*.bin" -o \
                -name "spiffs*.bin" \
              \) -exec cp -f {} artifact_output/ \;
            fi
          done

          # Copy flashing scripts from firmware/bin
          cp -f firmware/bin/device-install.* artifact_output/ 2>/dev/null || true
          cp -f firmware/bin/device-update.* artifact_output/ 2>/dev/null || true

          # Ensure Nordic DFU zip packages carry the required -ota.zip suffix
          # matching firmware-*.mt.json and Meshtastic-Android OTA validation
          for zf in artifact_output/firmware-*.zip; do
            if [ -f "$zf" ] && [[ "$zf" != *-ota.zip ]]; then
              ota_name="${zf%.zip}-ota.zip"
              echo "Renaming $zf to $ota_name for Android OTA / DFU compatibility..."
              mv -f "$zf" "$ota_name"
            fi
          done

          # For Xiao nRF52-based custom boards (spicy, solarxiao), provide an alias copy
          # matching Meshtastic-Android's effectiveTarget (seeed_xiao_nrf52840_kit)
          case "${{ matrix.variant_name }}" in
            spicy_e22p_i2c|spicy_m33_i2c|solarxiao_e22p)
              for zf in artifact_output/firmware-${{ matrix.variant_name }}-*-ota.zip; do
                if [ -f "$zf" ]; then
                  android_alias="artifact_output/firmware-seeed_xiao_nrf52840_kit-${{ matrix.tag }}-ota.zip"
                  echo "Creating Android OTA compatible alias: $android_alias"
                  cp -f "$zf" "$android_alias"
                fi
              done
              ;;
          esac

          # Copy custom variant OTA binary if provided (e.g. Ethernet-capable OTA bootloader)
          if [ -n "${{ matrix.variant_dir }}" ]; then
            for custom_ota in overlay/variants/${{ matrix.variant_dir }}/mt-*.bin overlay/variants/${{ matrix.variant_dir }}/*-ota.bin; do
              if [ -f "$custom_ota" ]; then
                echo "Copying custom OTA binary $(basename "$custom_ota") to artifact_output/..."
                cp -f "$custom_ota" artifact_output/
              fi
            done
          fi

          # Download Unified OTA binary for ESP32 boards and update firmware-*.mt.json
          python3 -c "
          import json, os, urllib.request, hashlib

          manifest_files = [f for f in os.listdir('artifact_output') if f.startswith('firmware-') and f.endswith('.mt.json')]
          for mf_name in manifest_files:
              mf_path = os.path.join('artifact_output', mf_name)
              try:
                  with open(mf_path, 'r', encoding='utf-8') as f:
                      manifest = json.load(f)

                  mcu = (manifest.get('mcu') or '').lower()
                  ota_filename = None
                  ota_url = None

                  if 'esp32s3' in mcu or 'esp32-s3' in mcu:
                      ota_filename = 'mt-esp32s3-ota.bin'
                      ota_url = 'https://github.com/meshtastic/esp32-unified-ota/releases/latest/download/mt-esp32s3-ota.bin'
                  elif 'esp32c3' in mcu or 'esp32-c3' in mcu or 'esp32c6' in mcu or 'esp32-c6' in mcu:
                      ota_filename = 'bleota-c3.bin'
                      ota_url = 'https://github.com/meshtastic/firmware-ota/releases/latest/download/firmware-c3.bin'
                  elif 'esp32' in mcu:
                      ota_filename = 'mt-esp32-ota.bin'
                      ota_url = 'https://github.com/meshtastic/esp32-unified-ota/releases/latest/download/mt-esp32-ota.bin'

                  if ota_filename and ota_url:
                      ota_dst = os.path.join('artifact_output', ota_filename)
                      if not os.path.isfile(ota_dst):
                          print(f'Downloading OTA recovery binary {ota_filename} from {ota_url}...')
                          req = urllib.request.Request(ota_url, headers={'User-Agent': 'curl/7.68.0'})
                          with urllib.request.urlopen(req) as resp:
                              ota_data = resp.read()
                          with open(ota_dst, 'wb') as f:
                              f.write(ota_data)
                      else:
                          with open(ota_dst, 'rb') as f:
                              ota_data = f.read()

                      md5 = hashlib.md5(ota_data).hexdigest()
                      ota_bytes = len(ota_data)

                      files_list = manifest.setdefault('files', [])
                      if not any(entry.get('name') == ota_filename for entry in files_list):
                          files_list.append({
                              'name': ota_filename,
                              'md5': md5,
                              'bytes': ota_bytes,
                              'part_name': 'app1'
                          })
                          with open(mf_path, 'w', encoding='utf-8') as f:
                              json.dump(manifest, f, indent=2)
                          print(f'Updated {mf_name} with {ota_filename} (part_name: app1)')
              except Exception as exc:
                  print(f'Warning: OTA processing failed for {mf_name}: {exc}')
          "

          # Capture exact upstream commit hash
          cd firmware
          UPSTREAM_SHA=$(git rev-parse HEAD)
          cd ..

          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Write build-manifest.json
          python3 -c "
          import json, os

          artifact_files = [
              f for f in os.listdir('artifact_output')
              if os.path.isfile(os.path.join('artifact_output', f))
          ]
          manifest = {
              'tag': '${{ matrix.tag }}',
              'channel': '${{ matrix.channel }}',
              'build_type': '${{ matrix.build_type }}',
              'variant_name': '${{ matrix.variant_name }}',
              'pio_env': '${{ matrix.pio_env }}',
              'is_custom_variant': str('${{ matrix.is_custom_variant }}').lower() == 'true',
              'variant_dir': '${{ matrix.variant_dir }}',
              'upstream_prs': '${{ matrix.upstream_prs }}',
              'local_patches': '${{ matrix.local_patches }}',
              'build_flags': '${{ matrix.build_flags }}',
              'upstream_commit': '$UPSTREAM_SHA',
              'build_timestamp': '$BUILD_TIME',
              'output_subpath': '${{ matrix.output_subpath }}',
              'artifacts': sorted(artifact_files)
          }
          with open('artifact_output/build-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2)
          "

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact_output/
          retention-days: 1

  publish-and-prune:
    name: Publish Builds & Prune Outdated
    needs: [plan, compile]
    if: always() && (needs.plan.outputs.has_builds == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml

      - name: Download all compiled artifacts
        if: needs.plan.outputs.has_builds == 'true'
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Move artifacts to output tree
        if: needs.plan.outputs.has_builds == 'true'
        run: |
          python3 -c "
          import os, shutil, json

          download_dir = 'downloaded-artifacts'
          if os.path.exists(download_dir):
              for root, dirs, files in os.walk(download_dir):
                  if 'build-manifest.json' in files:
                      manifest_path = os.path.join(root, 'build-manifest.json')
                      with open(manifest_path, 'r', encoding='utf-8') as f:
                          data = json.load(f)
                      target_subpath = data.get('output_subpath')
                      if target_subpath:
                          os.makedirs(target_subpath, exist_ok=True)
                          for f in files:
                              src = os.path.join(root, f)
                              dst = os.path.join(target_subpath, f)
                              shutil.copy2(src, dst)
                              print(f'Installed: {f} -> {dst}')
          "
          rm -rf downloaded-artifacts

      - name: Prune old releases and update builds/INDEX.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/prune_old_builds.py --active-folders '${{ needs.plan.outputs.active_folders }}'

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A builds/
          if git diff --staged --quiet; then
            echo "No changes in builds/ to commit."
          else
            git commit -m "Automated build & prune: Meshtastic firmware [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
