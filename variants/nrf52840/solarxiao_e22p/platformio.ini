; Seeed Xiao BLE: https://wiki.seeedstudio.com/XIAO_BLE/
; SolarXiao Advanced E22P (https://github.com/KF7R/solarxiao-meshtastic-firmware)
[env:solarxiao_e22p]
custom_meshtastic_hw_model = 88
custom_meshtastic_hw_model_slug = XIAO_NRF52_KIT
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = SolarXiao Advanced E22P
custom_meshtastic_images = seeed_xiao_nrf52_kit.svg
custom_meshtastic_tags = Seeed

extends = nrf52840_base
board_level = release
board = xiao_ble_sense
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/solarxiao_e22p
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -D SEEED_XIAO_NRF52840_KIT
  -D SEEED_XIAO_NRF_KIT_DEFAULT
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/solarxiao_e22p>
debug_tool = jlink
