# ============================================================================
# 3. CUSTOM BUILD PROFILES (PRs, Patches & Feature Modules)
# ============================================================================
# Each profile defines a set of upstream PRs, local patches, and build flags.
# `profile_name` is used directly as the directory name under builds/
# (e.g. "pr-10531 - Multi MQTT", "games - Full Suite").
#
# `min_version` / `max_version` enforces minimum/maximum upstream firmware
# tag compatibility (e.g. "2.8.0") to prevent compiling unsupported features
# on older firmware releases.
#
# `target_variants` options:
#   - ["all"]           : Compiles for EVERY variant (all custom overlays + all upstream boards)
#   - ["all_upstream"]  : Compiles for EVERY board defined under variants.upstream
#   - ["all_custom"]    : Compiles for EVERY custom overlay defined under variants.custom
#   - Explicit list     : e.g. ["station-g3"] or ["heltec-v4", "rak4631"]
#
# `exclude_variants` allows excluding specific variants (e.g. headless/e-ink).
#
# For any profile build, the CI automatically generates a README.md containing
# metadata, descriptions, and available artifacts.
custom_profiles:
  - profile_name: "pr-10531 - Multi MQTT"
    short_name: "MQTT-Multi"
    enabled: true
    min_version: "2.8.0"
    summary: "Allow MQTT uplinks to uplink multiple copies of packets"
    description: "Upstream PR #10531: Allow MQTT uplinks to uplink multiple copies of packets for analytics"
    upstream_prs:
      - 10531
    local_patches: []
    target_variants:
      # Custom nRF52840 variants
      - "spicy_e22p_i2c"
      - "spicy_m33_i2c"
      - "solarxiao_e22p"

      # ESP32 / ESP32-S3 boards
      - "heltec-v3"
      - "heltec-v4"
      - "heltec-v4-tft"
      - "heltec-v4r8"
      - "heltec-v4r8-tft"
      - "heltec-wireless-tracker-v2"
      - "station-g2"
      - "station-g3"
      - "t-deck"
      - "t-deck-tft"
      - "m5stack-cardputer-adv"
      - "picomputer-s3"
      - "picomputer-s3-tft"
      - "chatter2"
      - "tlora-pager"
      - "tbeam-s3-core"
      - "tlora-t3s3"
      - "axiometa-genesis-mini"
      - "tbeam"
      - "t-beam-1w"
    exclude_variants:
      - "station-g3-waveshare-eth"

  - profile_name: "pr-12084 - Station G3 LNA"
    short_name: "Station-G3-LNA"
    enabled: true
    min_version: "2.8.0"
    summary: "Software control for Station G3 discrete LNA via FEM interface"
    description: "Upstream PR #12084: Software control for Station G3 discrete LNA via FEM interface"
    upstream_prs:
      - 12084
    local_patches: []
    target_variants:
      - "station-g3"

  - profile_name: "games - Full Suite"
    short_name: "Games-Full"
    enabled: true
    min_version: "2.8.0"
    summary: "BaseUI Full Games Suite (Snake, Tetris, Chirpy Runner, Breakout)"
    description: |
      BaseUI Games module enabled with the complete 4-game arcade suite:
      * **Snake**
      * **Tetris**
      * **Chirpy Runner**
      * **Breakout**

      Targeting devices that feature 4-way D-Pads, 5-way joysticks, physical keyboards, rotary encoders, or trackballs.
    upstream_prs: []
    local_patches:
      - "games-conditional.patch"
    build_flags: "-D BASEUI_HAS_GAMES=1"
    target_variants:
      # nRF52840 (5-Way Joystick / Trackball / Encoder)
      - "wio-tracker-l1"
      - "wio-tracker-l1-pro-1w"
      - "muzi-base"
      - "meshtiny"
      # ESP32-S3 (Keyboards / D-Pads / Encoders)
      - "t-deck"
      - "m5stack-cardputer-adv"
      - "picomputer-s3"
      - "chatter2"
      - "tlora-pager"
      - "tbeam-s3-core"
      - "axiometa-genesis-mini"
      # Native Linux / Gamepad
      - "portduino"

  - profile_name: "games - Chirpy Only"
    short_name: "Games-Chirpy"
    enabled: true
    min_version: "2.8.0"
    summary: "BaseUI Chirpy Runner (Single-Button / Jump-Only Arcade Game)"
    description: |
      BaseUI Games module enabled strictly for Chirpy Runner (single-button jump game).
      Directional games (Snake, Tetris, Breakout) are disabled because these hardware targets feature only 1 or 2 push buttons.
    upstream_prs: []
    local_patches:
      - "games-conditional.patch"
    build_flags: "-D BASEUI_HAS_GAMES=1 -D GAMES_ENABLE_SNAKE=0 -D GAMES_ENABLE_TETRIS=0 -D GAMES_ENABLE_BREAKOUT=0 -D GAMES_ENABLE_CHIRPY=1"
    target_variants:
      # ESP32-S3 (1-2 Buttons + OLED/TFT)
      - "heltec-v3"
      - "heltec-v4"
      - "heltec-v4r8"
      - "heltec-v4r8-tft"
      - "heltec-wireless-tracker-v2"
      - "station-g2"
      - "station-g3"
      - "t-beam-1w"
      - "tlora-t3s3"
      # nRF52840 (1 Button + OLED/TFT)
      - "heltec-t096"
      - "heltec-t114"
      - "heltec-t1"
      - "rak4631"
      # ESP32 (1 Button + OLED)
      - "tbeam"

  - profile_name: "dm-relay"
    short_name: "DM-Relay"
    enabled: true
    summary: "DM Relay: Rebroadcasts DMs from favorited nodes as 2-hop mesh broadcasts"
    description: |
      Custom DMRelayModule:
      Listens for incoming direct messages (DMs) from favorited nodes (`nodeDB->isFavorite(from)`).
      When received, rebroadcasts the message payload to the primary channel (channel 0) as a 2-hop broadcast.
    upstream_prs: []
    local_patches:
      - "dm-relay.patch"
    build_flags: "-D ENABLE_DM_RELAY=1 -D DM_RELAY_HOP_LIMIT=2 -D DM_RELAY_CHANNEL=0"
    target_variants:
      - "all"
    exclude_variants:
      - "station-g3-waveshare-eth"
