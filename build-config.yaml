# ============================================================================
# Meshtastic Custom Builds Configuration
# ============================================================================
# Single source of truth for tracking upstream releases, board variants,
# and custom patch/PR profiles.
# ============================================================================

# ============================================================================
# 1. UPSTREAM TARGETING & RETENTION POLICY
# ============================================================================
release_channels:
  track_alpha: true
  track_beta: true
  # Explicit tags to always build/keep regardless of alpha/beta status (optional)
  pinned_tags:
    - "v2.8.2.4c89b69"

retention:
  # Retain the latest N releases per channel in ./builds/
  keep_latest_alpha: 1
  keep_latest_beta: 1

# ============================================================================
# 2. BOARD VARIANTS
# ============================================================================
variants:
  # --------------------------------------------------------------------------
  # A. Custom Overlay Variants (Defined in ./variants/<variant_dir>)
  # --------------------------------------------------------------------------
  # Only custom variants build vanilla firmware since they do not exist
  # in the official upstream repository.
  custom:
    # XXtra Spicy E22-900M33S I2C (https://github.com/KF7R/spicy-m33-i2c-firmware)
    - name: "spicy_m33_i2c"
      variant_dir: "nrf52840/spicy_m33_i2c"
      pio_env: "spicy_m33_i2c"
      build_vanilla: true
      min_version: "2.5.0"
      description: "Custom nRF52840 + Ebyte E22-900M33S (2W / 33dBm) I2C variant."
      repo_url: "https://github.com/KF7R/spicy-m33-i2c-firmware"

    # XXtra Spicy E22P I2C (https://github.com/KF7R/spicy-meshtastic-firmware)
    - name: "spicy_e22p_i2c"
      variant_dir: "nrf52840/spicy_e22p_i2c"
      pio_env: "spicy_e22p_i2c"
      build_vanilla: true
      min_version: "2.5.0"
      description: "Custom nRF52840 + Ebyte E22P I2C variant."
      repo_url: "https://github.com/KF7R/spicy-meshtastic-firmware"

    # Station G3 with Waveshare ESP32-S3-ETH interposer
    - name: "station-g3-waveshare-eth"
      variant_dir: "esp32s3/station-g3-waveshare-eth"
      pio_env: "station-g3-waveshare-eth"
      build_vanilla: true
      min_version: "2.8.0"
      description: "Station G3 with Waveshare ESP32-S3-ETH W5500 interposer and custom Ethernet + BLE Unified OTA bootloader (0x650000)."
      repo_url: "https://github.com/tylerpieper/station-g3-esp32-s3-eth"
      local_patches:
        - "station-g3-eth-ota.patch"

    # SolarXiao Advanced Plus E22P (https://github.com/KF7R/solarxiao-meshtastic-firmware)
    - name: "solarxiao_e22p"
      variant_dir: "nrf52840/solarxiao_e22p"
      pio_env: "solarxiao_e22p"
      build_vanilla: true
      min_version: "2.5.0"
      description: "SolarXiao Advanced Plus E22P nRF52840 solar node with GPS_ENABLE=0 patch."
      repo_url: "https://github.com/KF7R/solarxiao-meshtastic-firmware"
      local_patches:
        - "gps-enable-zero.patch"

  # --------------------------------------------------------------------------
  # B. Upstream PlatformIO Environments
  # --------------------------------------------------------------------------
  # Standard boards from the upstream meshtastic repo.
  # build_vanilla is false because official binaries can be downloaded directly
  # from the official meshtastic/firmware release page.
  upstream:
    - name: "heltec-v3"
      pio_env: "heltec-v3"
      build_vanilla: false

    - name: "heltec-v4"
      pio_env: "heltec-v4"
      build_vanilla: false
      has_mui: true

    - name: "heltec-v4-tft"
      pio_env: "heltec-v4-tft"
      build_vanilla: false

    - name: "heltec-v4r8"
      pio_env: "heltec-v4-r8-oled"
      build_vanilla: false
      has_mui: true

    - name: "heltec-v4r8-tft"
      pio_env: "heltec-v4-r8-tft"
      build_vanilla: false

    - name: "heltec-wireless-tracker-v2"
      pio_env: "heltec-wireless-tracker-v2"
      build_vanilla: false

    - name: "heltec-t096"
      pio_env: "heltec-mesh-node-t096"
      build_vanilla: false

    - name: "rak3401-1watt"
      pio_env: "rak3401-1watt"
      build_vanilla: false

    - name: "station-g3"
      pio_env: "station-g3"
      build_vanilla: false

    - name: "station-g2"
      pio_env: "station-g2"
      build_vanilla: false

    - name: "tracker-t1000e"
      pio_env: "tracker-t1000-e"
      build_vanilla: false

    - name: "tracker-x1"
      pio_env: "seeed_mesh_tracker_X1"
      build_vanilla: false
      min_version: "2.8.0"

    - name: "rak-wismeshtag"
      pio_env: "rak_wismeshtag"
      build_vanilla: false

    - name: "wio-tracker-l1"
      pio_env: "seeed_wio_tracker_L1"
      build_vanilla: false

    - name: "wio-tracker-l1-pro-1w"
      pio_env: "seeed_wio_tracker_L1_Pro_1W"
      build_vanilla: false
      min_version: "2.8.0"

    - name: "rak4631"
      pio_env: "rak4631"
      build_vanilla: false

    - name: "seeed-p1-pro"
      pio_env: "seeed_solar_node"
      build_vanilla: false

    - name: "heltec-t114"
      pio_env: "heltec-mesh-node-t114"
      build_vanilla: false

    - name: "portduino"
      pio_env: "native"
      build_vanilla: false

    - name: "heltec-mesh-pocket-5000"
      pio_env: "heltec-mesh-pocket-5000"
      build_vanilla: false

    - name: "heltec-mesh-pocket-10000"
      pio_env: "heltec-mesh-pocket-10000"
      build_vanilla: false

    - name: "t-echo"
      pio_env: "t-echo"
      build_vanilla: false

    - name: "t-deck"
      pio_env: "t-deck"
      build_vanilla: false
      has_mui: true

    - name: "t-deck-tft"
      pio_env: "t-deck-tft"
      build_vanilla: false

    # Tier 1 Game Targets (Keyboards / Joysticks / Encoders / Trackballs)
    - name: "m5stack-cardputer-adv"
      pio_env: "m5stack-cardputer-adv"
      build_vanilla: false

    - name: "picomputer-s3"
      pio_env: "picomputer-s3"
      build_vanilla: false
      has_mui: true

    - name: "picomputer-s3-tft"
      pio_env: "picomputer-s3-tft"
      build_vanilla: false

    - name: "chatter2"
      pio_env: "chatter2"
      build_vanilla: false

    - name: "tlora-pager"
      pio_env: "tlora-pager"
      build_vanilla: false

    - name: "tbeam-s3-core"
      pio_env: "tbeam-s3-core"
