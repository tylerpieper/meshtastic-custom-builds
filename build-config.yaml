# ============================================================================
# Meshtastic Custom Builds Configuration
# ============================================================================
# Single source of truth for tracking upstream releases, board variants,
# and custom patch/PR profiles.
# ============================================================================

# ============================================================================
# 1. UPSTREAM TARGETING & RETENTION POLICY
# ============================================================================
release_channels:
  track_alpha: true
  track_beta: true
  # Explicit tags to always build/keep regardless of alpha/beta status (optional)
  pinned_tags: []

retention:
  # Retain the latest N releases per channel in ./builds/
  keep_latest_alpha: 1
  keep_latest_beta: 1

# ============================================================================
# 2. BOARD VARIANTS
# ============================================================================
variants:
  # --------------------------------------------------------------------------
  # A. Custom Overlay Variants (Defined in ./variants/<variant_dir>)
  # --------------------------------------------------------------------------
  # Only custom variants build vanilla firmware since they do not exist
  # in the official upstream repository.
  custom:
    # XXtra Spicy E22-900M33S I2C (https://github.com/KF7R/spicy-m33-i2c-firmware)
    - name: "spicy_m33_i2c"
      variant_dir: "nrf52840/spicy_m33_i2c"
      pio_env: "spicy_m33_i2c"
      build_vanilla: true

    # XXtra Spicy E22P I2C (https://github.com/KF7R/spicy-meshtastic-firmware)
    - name: "spicy_e22p_i2c"
      variant_dir: "nrf52840/spicy_e22p_i2c"
      pio_env: "spicy_e22p_i2c"
      build_vanilla: true

  # --------------------------------------------------------------------------
  # B. Upstream PlatformIO Environments
  # --------------------------------------------------------------------------
  # Standard boards from the upstream meshtastic repo.
  # build_vanilla is false because official binaries can be downloaded directly
  # from the official meshtastic/firmware release page.
  upstream:
    - name: "heltec-v3"
      pio_env: "heltec-v3"
      build_vanilla: false

    - name: "heltec-v4"
      pio_env: "heltec-v4"
      build_vanilla: false

    - name: "heltec-v4r8"
      pio_env: "heltec-v4-r8-oled"
      build_vanilla: false

    - name: "heltec-v4r8-tft"
      pio_env: "heltec-v4-r8-tft"
      build_vanilla: false

    - name: "heltec-wireless-tracker-v2"
      pio_env: "heltec-wireless-tracker-v2"
      build_vanilla: false

    - name: "heltec-t096"
      pio_env: "heltec-mesh-node-t096"
      build_vanilla: false

    - name: "rak3401-1watt"
      pio_env: "rak3401-1watt"
      build_vanilla: false

    - name: "station-g3"
      pio_env: "station-g3"
      build_vanilla: false

    - name: "station-g2"
      pio_env: "station-g2"
      build_vanilla: false

    - name: "tracker-t1000e"
      pio_env: "tracker-t1000-e"
      build_vanilla: false

    - name: "tracker-x1"
      pio_env: "seeed_mesh_tracker_X1"
      build_vanilla: false

    - name: "rak-wismeshtag"
      pio_env: "rak_wismeshtag"
      build_vanilla: false

    - name: "wio-tracker-l1"
      pio_env: "seeed_wio_tracker_L1"
      build_vanilla: false

    - name: "wio-tracker-l1-pro-1w"
      pio_env: "seeed_wio_tracker_L1_Pro_1W"
      build_vanilla: false

    - name: "rak4631"
      pio_env: "rak4631"
      build_vanilla: false

    - name: "seeed-p1-pro"
      pio_env: "seeed_solar_node"
      build_vanilla: false

    - name: "heltec-t114"
      pio_env: "heltec-mesh-node-t114"
      build_vanilla: false

    - name: "portduino"
      pio_env: "native"
      build_vanilla: false

    - name: "heltec-mesh-pocket-5000"
      pio_env: "heltec-mesh-pocket-5000"
      build_vanilla: false

    - name: "heltec-mesh-pocket-10000"
      pio_env: "heltec-mesh-pocket-10000"
      build_vanilla: false

    - name: "t-echo"
      pio_env: "t-echo"
      build_vanilla: false

    - name: "t-deck"
      pio_env: "t-deck"
      build_vanilla: false

# ============================================================================
# 3. CUSTOM BUILD PROFILES (PRs & Local Patches)
# ============================================================================
# Each profile defines a set of upstream PRs and/or local .patch files.
# `profile_name` is used directly as the directory name under builds/
# (e.g. "pr-10531 - Multi MQTT").
#
# `target_variants` options:
#   - ["all"]           : Compiles for EVERY variant (all custom overlays + all upstream boards)
#   - ["all_upstream"]  : Compiles for EVERY board defined under variants.upstream
#   - ["all_custom"]    : Compiles for EVERY custom overlay defined under variants.custom
#   - Explicit list     : e.g. ["station-g3"] or ["heltec-v4", "rak4631"]
#
# For any PR build, the CI automatically generates a README.md containing the
# upstream PR summary, author details, and discussion body.
custom_profiles:
  - profile_name: "pr-10531 - Multi MQTT"
    enabled: true
    summary: "Allow MQTT uplinks to uplink multiple copies of packets"
    description: "Upstream PR #10531: Allow MQTT uplinks to uplink multiple copies of packets for analytics"
    # Target only alpha (v2.8+) since PR 10531 requires v2.8 routing architecture
    channels:
      - "alpha"
    upstream_prs:
      - 10531
    local_patches: []
    target_variants:
      - "all"

  - profile_name: "pr-12084 - Station G3 LNA"
    enabled: true
    summary: "Software control for Station G3 discrete LNA via FEM interface"
    description: "Upstream PR #12084: Software control for Station G3 discrete LNA via FEM interface"
    channels:
      - "alpha"
    upstream_prs:
      - 12084
    local_patches: []
    target_variants:
      - "station-g3"
