# ============================================================================
# Meshtastic Custom Builds Configuration
# ============================================================================
# Single source of truth for tracking upstream releases, board variants,
# and custom patch/PR profiles.
# ============================================================================

# ============================================================================
# 1. UPSTREAM TARGETING & RETENTION POLICY
# ============================================================================
release_channels:
  track_alpha: true
  track_beta: true
  # Explicit tags to always build/keep regardless of alpha/beta status (optional)
  pinned_tags: []

retention:
  # Retain the latest N releases per channel in ./builds/
  keep_latest_alpha: 1
  keep_latest_beta: 1

# ============================================================================
# 2. BOARD VARIANTS
# ============================================================================
variants:
  # --------------------------------------------------------------------------
  # A. Custom Overlay Variants (Defined in ./variants/<variant_dir>)
  # --------------------------------------------------------------------------
  custom:
    # XXtra Spicy E22-900M33S I2C (https://github.com/KF7R/spicy-m33-i2c-firmware)
    - name: "spicy_m33_i2c"
      variant_dir: "nrf52840/spicy_m33_i2c"
      pio_env: "spicy_m33_i2c"
      build_vanilla: true

    # XXtra Spicy E22P I2C (https://github.com/KF7R/spicy-meshtastic-firmware)
    - name: "spicy_e22p_i2c"
      variant_dir: "nrf52840/spicy_e22p_i2c"
      pio_env: "spicy_e22p_i2c"
      build_vanilla: true

  # --------------------------------------------------------------------------
  # B. Upstream PlatformIO Environments
  # --------------------------------------------------------------------------
  upstream:
    # --- Standard Builds (Built vanilla for active releases) ---
    - name: "heltec-v3"
      pio_env: "heltec-v3"
      build_vanilla: true

    - name: "heltec-v4"
      pio_env: "heltec-v4"
      build_vanilla: true

    - name: "heltec-v4r8"
      pio_env: "heltec-v4-r8-oled"
      build_vanilla: true

    - name: "heltec-v4r8-tft"
      pio_env: "heltec-v4-r8-tft"
      build_vanilla: true

    - name: "heltec-wireless-tracker-v2"
      pio_env: "heltec-wireless-tracker-v2"
      build_vanilla: true

    - name: "heltec-t096"
      pio_env: "heltec-mesh-node-t096"
      build_vanilla: true

    - name: "rak3401-1watt"
      pio_env: "rak3401-1watt"
      build_vanilla: true

    # --- Targets for Custom Profiles (PR 10531) ---
    - name: "station-g3"
      pio_env: "station-g3"
      build_vanilla: false

    - name: "station-g2"
      pio_env: "station-g2"
      build_vanilla: false

    - name: "tracker-t1000e"
      pio_env: "tracker-t1000-e"
      build_vanilla: false

    - name: "tracker-x1"
      pio_env: "seeed_mesh_tracker_X1"
      build_vanilla: false

    - name: "rak-wismeshtag"
      pio_env: "rak_wismeshtag"
      build_vanilla: false

    - name: "wio-tracker-l1"
      pio_env: "seeed_wio_tracker_L1"
      build_vanilla: false

    - name: "wio-tracker-l1-pro-1w"
      pio_env: "seeed_wio_tracker_L1_Pro_1W"
      build_vanilla: false

    - name: "rak4631"
      pio_env: "rak4631"
      build_vanilla: false

    - name: "seeed-p1-pro"
      pio_env: "seeed_solar_node"
      build_vanilla: false

    - name: "heltec-t114"
      pio_env: "heltec-mesh-node-t114"
      build_vanilla: false

    - name: "portduino"
      pio_env: "native"
      build_vanilla: false

    - name: "heltec-mesh-pocket-5000"
      pio_env: "heltec-mesh-pocket-5000"
      build_vanilla: false

    - name: "heltec-mesh-pocket-10000"
      pio_env: "heltec-mesh-pocket-10000"
      build_vanilla: false

    - name: "t-echo"
      pio_env: "t-echo"
      build_vanilla: false

    - name: "t-deck"
      pio_env: "t-deck"
      build_vanilla: false

# ============================================================================
# 3. CUSTOM BUILD PROFILES (PRs & Local Patches)
# ============================================================================
# Each profile defines a set of upstream PRs and/or local .patch files.
# `target_variants` options:
#   - ["all"]           : Compiles for EVERY variant (all custom overlays + all upstream boards)
#   - ["all_upstream"]  : Compiles for EVERY board defined under variants.upstream (or ["upstream"])
#   - ["all_custom"]    : Compiles for EVERY custom overlay defined under variants.custom (or ["custom"])
#   - Explicit list     : e.g. ["heltec-v4", "rak4631", "station-g3"]
# Whenever you add a new board under variants.upstream, using "all_upstream" (or "all")
# automatically compiles that new board for this profile without needing to edit here!
custom_profiles:
  - profile_name: "pr-10531"
    enabled: true
    description: "Upstream PR #10531: Allow MQTT uplinks to uplink multiple copies of packets"
    upstream_prs:
      - 10531
    local_patches: []
    target_variants:
      - "all_upstream"
